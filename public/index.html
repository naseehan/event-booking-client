<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <meta
      name="description"
      content="Noble Events - Professional Event Booking & Management Platform"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    
    <!-- Favicon -->
    <link rel="icon" href="./images/ticket-logo.png" type="image/x-icon" />

    <!-- FontAwesome Icon Stylesheet -->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v6.4.2/css/all.css"
    />

    <!-- Animate On Scroll -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <title>Noble Events | Experience the Best Live Events</title>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>

    <!-- Animate on Scroll init -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      if (typeof AOS !== 'undefined') {
        AOS.init({ once: true });
      }
    </script>
  </body>
</html>
